# 종합 실습은 pgvector가 선택이 아니라 기본이다(교안 p.313) — day3-consult-agent의
# SimpleVectorStore(인메모리)와 달리 재시작해도 인제스트한 문서가 남아야 한다.
#
#   docker compose up -d
#
# Phase 5(JDBC 대화 메모리)도 이 컨테이너의 같은 DB를 쓴다 — 별도 컨테이너를 띄우지 않는다.
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "${HELPDESK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
