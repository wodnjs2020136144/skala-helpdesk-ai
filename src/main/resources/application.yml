spring:
  application:
    name: skala-helpdesk-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/helpdesk
    username: helpdesk
    password: helpdesk

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small

    # 운영에서는 프롬프트 원문 로깅을 반드시 끈다(개인정보가 그대로 쌓인다).
    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false
        # JdbcChatMemoryRepository는 도구 호출 중간 메시지를 저장하지 않는다.
        # Tool Calling을 Memory(200)와 RAG(300) 뒤에 두어 중간 반복은 내부 이력으로
        # 처리한다. RAG가 도구 호출마다 중복 실행되는 임베딩 비용도 막는다.
        tool-calling:
          advisor-order: 350
      # JdbcChatMemoryRepository 기본값은 "embedded"라 H2 등에서만 자동으로 스키마를 만든다.
      # 우리는 외부 pgvector(Postgres)를 쓰므로 always로 켜지 않으면 spring_ai_chat_memory
      # 테이블이 없어 첫 대화부터 500이 난다(Phase 5, 검증 시나리오 ①·③ 실측 중 발견).
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536   # text-embedding-3-small 차원과 반드시 일치(p.313)

# Phase 1(A) — HelpDeskProperties가 이 블록을 바인딩한다. 코드에 상수를 남기지 않는다.
helpdesk:
  rag:
    top-k: 5
    inspection-max-top-k: 50 # 관리자 진단은 운영 검색보다 넓게 청크를 살펴볼 수 있다.
    threshold: 0.3   # 실측 조정(2026-08-21): 자연어 질문 기준 무관 질의 최고 0.287, 자퇴 0.369,
                      # 제적 0.434, 휴학·졸업요건 0.5+. 0.5는 무관 질문은 잘 걸렀지만 자퇴·제적처럼
                      # 근거가 실제로 있는 질문까지 걸러냈다(재현율 손실) — docs/검증-시나리오.md ① 참고
    chunk-size: 300           # 학사규정 조항 단위가 짧아 day3-consult-agent(400)보다 작게 시작
    min-chunk-size-chars: 150 # 검증 후 조정 — /api/admin/chunks로 preview가 조항을 온전히 담는지 확인
  memory:
    max-messages: 20
  tool:
    max-calls: 5
  ai:
    fallback:
      enabled: true
      model: gpt-4o   # 주 모델(gpt-4o-mini) 장애 시 대체 경로(Phase 8, 검증 시나리오 ⑦)
    budget:
      max-total-tokens: 200000   # 초과해도 요청은 막지 않는다 — 경고 로그·ai.budget.exceeded 지표만 남긴다

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: skala-helpdesk-ai

logging:
  level:
    com.skala.helpdesk: DEBUG
    AI_TOOL_AUDIT: INFO
